<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast & Furious Quote Generator</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            line-height: 1.6;
            color: #111;
            background: #fff;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
        }
        blockquote {
            margin: 0 0 1.5rem 0;
            padding: 1rem;
            border-left: 3px solid #111;
            font-size: 1.25rem;
            background: #f9f9f9;
        }
        cite {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            font-style: normal;
            color: #666;
        }
        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            background: #111;
            color: #fff;
            border: none;
        }
        button:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <h1>Fast & Furious Quote Generator</h1>

    <blockquote>
        <p id="quote-text">"I live my life a quarter mile at a time."</p>
        <cite id="quote-author">— Dominic Toretto</cite>
    </blockquote>

    <button id="generate-btn">Get Another Quote</button>

    <script>
        const quotes = [
            { text: "I live my life a quarter mile at a time.", author: "Dominic Toretto" },
            { text: "It don't matter if you win by an inch or a mile. Winning's winning.", author: "Dominic Toretto" },
            { text: "Ask any racer, any real racer. It don't matter if you win by an inch or a mile. Winning's winning.", author: "Dominic Toretto" },
            { text: "You break her heart, I'll break your neck.", author: "Dominic Toretto" },
            { text: "I never thought like that. I just thought about the moment. For those ten seconds or less, I'm free.", author: "Dominic Toretto" },
            { text: "You don't turn your back on family, even when they do.", author: "Dominic Toretto" },
            { text: "Ejecto seato, cuz!", author: "Roman Pearce" },
            { text: "Guns. Lots of guns.", author: "Tej Parker" },
            { text: "Ride or die, remember?", author: "Letty Ortiz" },
            { text: "Money comes and goes. The most important thing in life will always be the people in this room.", author: "Dominic Toretto" }
        ];

        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');
        const generateBtn = document.getElementById('generate-btn');

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            return quotes[randomIndex];
        }

        generateBtn.addEventListener('click', () => {
            const randomQuote = getRandomQuote();
            quoteText.textContent = `"${randomQuote.text}"`;
            quoteAuthor.textContent = `— ${randomQuote.author}`;
        });
    </script>

</body>
</html>
