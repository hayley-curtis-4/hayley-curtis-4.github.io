<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast & Furious Quote Generator</title>
    <style>
        :root {
            --bg-color: #fff;
            --text-color: #111;
            --box-bg: #f9f9f9;
            --border-color: #111;
            --meta-color: #666;
            --btn-bg: #111;
            --btn-text: #fff;
            --btn-hover: #333;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #f1f1f1;
            --box-bg: #1e1e1e;
            --border-color: #f1f1f1;
            --meta-color: #aaa;
            --btn-bg: #f1f1f1;
            --btn-text: #121212;
            --btn-hover: #ddd;
        }

        body {
            font-family: sans-serif;
            max-width: 600px;
            margin: 4rem auto;
            padding: 0 1.5rem;
            line-height: 1.6;
            color: var(--text-color);
            background: var(--bg-color);
            transition: background 0.3s, color 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        blockquote {
            margin: 0 0 1.5rem 0;
            padding: 1rem;
            border-left: 3px solid var(--border-color);
            font-size: 1.25rem;
            background: var(--box-bg);
        }

        cite {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.9rem;
            font-style: normal;
            color: var(--meta-color);
        }

        button {
            padding: 0.6rem 1.2rem;
            font-size: 1rem;
            cursor: pointer;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--btn-hover);
        }

        .theme-toggle {
            padding: 0.4rem 0.8rem;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Fast & Furious Quotes</h1>
        <button id="theme-btn" class="theme-toggle">Dark Mode</button>
    </header>

    <blockquote>
        <p id="quote-text">"I live my life a quarter mile at a time."</p>
        <cite id="quote-author">— Dominic Toretto</cite>
    </blockquote>

    <button id="generate-btn">Get Another Quote</button>

    <script>
        const quotes = [
            { text: "I live my life a quarter mile at a time.", author: "Dominic Toretto" },
            { text: "It don't matter if you win by an inch or a mile. Winning's winning.", author: "Dominic Toretto" },
            { text: "Ask any racer, any real racer. It don't matter if you win by an inch or a mile. Winning's winning.", author: "Dominic Toretto" },
            { text: "You break her heart, I'll break your neck.", author: "Dominic Toretto" },
            { text: "I never thought like that. I just thought about the moment. For those ten seconds or less, I'm free.", author: "Dominic Toretto" },
            { text: "You don't turn your back on family, even when they do.", author: "Dominic Toretto" },
            { text: "Ejecto seato, cuz!", author: "Roman Pearce" },
            { text: "Guns. Lots of guns.", author: "Tej Parker" },
            { text: "Ride or die, remember?", author: "Letty Ortiz" },
            { text: "Money comes and goes. The most important thing in life will always be the people in this room.", author: "Dominic Toretto" }
        ];

        const quoteText = document.getElementById('quote-text');
        const quoteAuthor = document.getElementById('quote-author');
        const generateBtn = document.getElementById('generate-btn');
        const themeBtn = document.getElementById('theme-btn');
        const htmlElement = document.documentElement;

        function getRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quotes.length);
            return quotes[randomIndex];
        }

        generateBtn.addEventListener('click', () => {
            const randomQuote = getRandomQuote();
            quoteText.textContent = `"${randomQuote.text}"`;
            quoteAuthor.textContent = `— ${randomQuote.author}`;
        });

        themeBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                htmlElement.removeAttribute('data-theme');
                themeBtn.textContent = 'Dark Mode';
            } else {
                htmlElement.setAttribute('data-theme', 'dark');
                themeBtn.textContent = 'Light Mode';
            }
        });
    </script>

</body>
</html>
